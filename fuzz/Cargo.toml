[package]
name = "karasu-mesh-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

# Independent development workspace: these dependencies never enter the production lockfile.
[workspace]
members = ["."]
resolver = "2"

[dependencies]
libfuzzer-sys = "0.4"
karasu-core = { path = "../crates/karasu-core" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[[bin]]
name = "drainage"
path = "fuzz_targets/drainage.rs"
test = false
doc = false
bench = false

