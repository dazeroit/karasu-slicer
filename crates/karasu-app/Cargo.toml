[package]
name = "karasu-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "Desktop application for karasu-slicer (M6)"

# The application's executable is `karasu` (owner, 2026-11-09); the crate keeps the
# `karasu-<module>` name.
[[bin]]
name = "karasu"
path = "src/main.rs"

[dependencies]
karasu-core = { path = "../karasu-core" }
karasu-project = { path = "../karasu-project" }
# The logging facade (TD-096), the same version as karasu-project's.
log = { version = "=0.4.34", default-features = false, features = ["std"] }
# Desktop stack selected in TD-042; reviewed in docs/research/M6-DEPENDENCY-REVIEW.md (TD-068).
# Only the needed eframe features: accessibility, bundled fonts, X11 and Wayland, wgpu rendering.
eframe = { version = "=0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "x11",
    "wgpu",
] }

# Decodes the bundled PNG artwork (splash); reviewed in docs/research/M6-DEPENDENCY-REVIEW.md.
png = "=0.18.1"
# Native file dialogs (owner decision: native for now); reviewed in
# docs/research/M6-DEPENDENCY-REVIEW.md and added with import and export (M6.3).
rfd = "=0.17.2"
# Interface localisation with Project Fluent (TD-080); reviewed in
# docs/research/M6-DEPENDENCY-REVIEW.md.
fluent-bundle = "=0.16.0"
unic-langid = "=0.9.6"
# The user's settings file (TD-097): the versions karasu-core already uses, so nothing new enters
# the dependency tree.
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
# Reads the installed memory, which sizes the hollowing's memory budget (TD-094); reviewed in
# docs/research/M6-DEPENDENCY-REVIEW.md. Only the system information it needs.
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
# Reads the catalogs' syntax trees in tests (already in the tree through fluent-bundle).
fluent-syntax = "=0.12.0"

[lints]
workspace = true
