[workspace]
members = ["crates/karasu-app", "crates/karasu-cli", "crates/karasu-core", "crates/karasu-project", "tools/reference-fixtures"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
# The owner's choice of 2026-11-11 (TD-145): the name and logo are trademarks, not licensed.
license = "AGPL-3.0-or-later"
authors = ["Ivan Maruca"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

